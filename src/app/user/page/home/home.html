<div class="home">

  <!-- HERO -->
  <section class="hero">
    
    <h1>Conectando você à sua cidade</h1>
    <p>Registre problemas e acompanhe soluções em tempo real.</p>

    <button (click)="irParaRegistrar()">
      Registrar Problema
    </button>
  </section>

  <!-- AÇÕES -->
  <section class="grid">

    <div class="card" (click)="irParaRegistrar()">
      <div class="icon">📍</div>
      <h3>Registrar</h3>
      <p>Informe um problema</p>
    </div>

    <div class="card" (click)="irParaOcorrencia()">
      <div class="icon">📋</div>
      <h3>Minhas</h3>
      <p>Acompanhe pedidos</p>
    </div>

    <div class="card" (click)="irParaPerfil()">
      <div class="icon">👤</div>
      <h3>Perfil</h3>
      <p>Seus dados</p>
    </div>

  </section>

  <!-- STATS -->
  <section class="grid">

    <div class="stat">
      <h2>120</h2>
      <p>Ocorrências</p>
    </div>

    <div class="stat">
      <h2>85</h2>
      <p>Resolvidas</p>
    </div>

    <div class="stat">
      <h2>35</h2>
      <p>Em andamento</p>
    </div>

  </section>

</div>
