<div class="registrar">

  <!-- BOTÃO VOLTAR -->
  <button
    class="back-btn"
    type="button"
    (click)="irParaHome()"
  >
    ← Voltar
  </button>

  <h1>Registrar Problema</h1>

  <p class="sub">
    Informe um problema na sua cidade
  </p>

  <form
    class="form"
    (ngSubmit)="criarOcorrencia()"
  >

    <!-- TIPO -->
    <div class="field">
      <label>Tipo de problema</label>

      <select [(ngModel)]="categoria" name="categoria">
        <option value="">Selecione</option>
        <option value="Buraco na rua">Buraco na rua</option>
        <option value="Iluminação pública">Iluminação pública</option>
        <option value="Lixo acumulado">Lixo acumulado</option>
        <option value="Outro">Outro</option>
      </select>
    </div>

    <!-- DESCRIÇÃO -->
    <div class="field">
      <label>Descrição</label>

      <textarea
        rows="4"
        placeholder="Descreva o problema..."
        [(ngModel)]="descricao"
        name="descricao">
      </textarea>
    </div>

    <!-- LOCALIZAÇÃO -->
    <div class="field">
      <label>Localização</label>

      <input
        type="text"
        placeholder="Digite o endereço..."
        [(ngModel)]="localizacao"
        name="localizacao"
      />
    </div>

    <!-- IMAGEM -->
    <div class="field">
      <label>Imagem (opcional)</label>

      <input
        type="file"
        accept="image/*"
        (change)="selecionarImagem($event)"
      />
    </div>

    <!-- PREVIEW (AGORA FUNCIONA ANTES DO UPLOAD) -->
    <img
      *ngIf="previewUrl"
      [src]="previewUrl"
      class="preview"
    />

    <!-- BOTÃO FINAL -->
    <button
      type="submit"
      class="btn"
      [disabled]="loading || !categoria || !descricao"
    >
      {{ loading ? 'Enviando...' : 'Enviar Problema' }}
    </button>

  </form>

</div>
