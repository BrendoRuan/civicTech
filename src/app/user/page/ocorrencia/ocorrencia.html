<div class="ocorrencias">

  <!-- BOTÃO VOLTAR -->
  <button
    class="back-btn"
    (click)="irParaHome()"
  >
    ← Voltar
  </button>

  <h1>Todas as Ocorrências</h1>

  <p class="sub">
    Acompanhe os problemas registrados
  </p>

  <!-- LOADING -->
  <p *ngIf="loading">
    Carregando ocorrências...
  </p>

  <!-- LISTA -->
  <div class="lista">

    <div
      class="item"
      *ngFor="let ocorrencia of ocorrencias"
    >

      <!-- INFO -->
      <div class="info">

        <h3>
          📍 {{ ocorrencia.titulo }}
        </h3>

        <p>
          {{ ocorrencia.descricao }}
        </p>

        <small>
          {{ ocorrencia.categoria }}
        </small>

      </div>

      <!-- LADO DIREITO -->
      <div class="direita">

        <!-- IMAGEM -->
        <img
          *ngIf="ocorrencia.imagemUrl"
          [src]="ocorrencia.imagemUrl"
          alt="Imagem ocorrência"
          class="imagem"
        />

        <!-- STATUS -->
        <span
          class="status"

          [ngClass]="{

            'analise':
              ocorrencia.status === 'EM_ANALISE',

            'andamento':
              ocorrencia.status === 'EM_ANDAMENTO',

            'resolvido':
              ocorrencia.status === 'RESOLVIDO',

            'cancelado':
              ocorrencia.status === 'CANCELADO'
          }"
        >

          {{ ocorrencia.status }}

        </span>

      </div>

    </div>

  </div>

</div>
